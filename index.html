<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FANUC 5-Axis Grinding CAM</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root { --bg: #14171c; --panel: #1c2128; --border: #2a3038; --text: #d5dbe3; --muted: #8a93a0; --accent: #3d8bfd; --ok: #4caf50; --warn: #ff9800; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    .topbar { display: flex; align-items: center; gap: 24px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .brand { font-weight: 600; color: var(--accent); }
    #main-nav { display: flex; gap: 8px; flex: 1; }
    #main-nav button { background: transparent; color: var(--muted); border: 1px solid transparent; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    #main-nav button:hover { color: var(--text); background: #232a33; }
    #main-nav button.active { color: var(--accent); border-color: var(--accent); }
    main { display: grid; gap: 16px; padding: 16px; grid-template-columns: 1fr; flex: 1; overflow: auto; }
    main.split { grid-template-columns: 380px 1fr; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; overflow: auto; }
    .panel h2 { margin: 0 0 12px; font-size: 16px; color: var(--accent); }
    .panel label { display: block; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
    .panel input, .panel textarea, .panel select { width: 100%; padding: 7px 9px; margin-top: 4px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 3px; font-family: inherit; font-size: 13px; }
    .panel button { padding: 8px 14px; background: var(--accent); color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 13px; }
    .panel button:hover { filter: brightness(1.1); }
    .viewport-panel { display: flex; flex-direction: column; gap: 8px; }
    .viewport { flex: 1; min-height: 400px; background: #14171c; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .view-toolbar { display: flex; gap: 6px; }
    .view-toolbar button { padding: 4px 10px; background: #232a33; color: var(--text); border: 1px solid var(--border); border-radius: 3px; cursor: pointer; }
    .hint { color: var(--muted); font-size: 12px; margin: 8px 0; }
    .warn { color: var(--warn); font-size: 12px; }
    .ok { color: var(--ok); }
    .info-grid dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 12px 0 0; }
    .info-grid dt { color: var(--muted); }
    .info-grid dd { margin: 0; }
    .project-list { list-style: none; padding: 0; margin: 0; }
    .project-list li { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; }
    .project-list li:hover { background: #232a33; }
    .project-list .status { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #232a33; color: var(--muted); }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">FANUC 31i-B5 Plus · Grinding CAM</div>
      <nav id="main-nav"></nav>
      <div id="user-badge"></div>
    </header>
    <main id="view-root" aria-live="polite"></main>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLLoader } from 'three/addons/loaders/STLLoader.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

    // --- CLIENT API ---
    let accessToken = null;
    export function setToken(t) { accessToken = t; }
    async function request(path, options = {}) {
      const headers = {
        ...(options.body instanceof FormData ? {} : { 'Content-Type': 'application/json' }),
        ...(accessToken ? { Authorization: `Bearer ${accessToken}` } : {}),
        ...options.headers,
      };
      const res = await fetch(`/api${path}`, { ...options, headers });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error ?? `HTTP ${res.status}`);
      return body;
    }
    const api = {
      get: (p) => request(p),
      post: (p, data) => request(p, { method: 'POST', body: JSON.stringify(data) }),
      upload: (p, formData) => request(p, { method: 'POST', body: formData }),
    };

    // --- CLIENT AUTH ---
    const SESSION_KEY = 'fanuc-cam-token';
    function loadToken() { const t = localStorage.getItem(SESSION_KEY); if (t) setToken(t); return t; }
    function saveToken(t) { localStorage.setItem(SESSION_KEY, t); setToken(t); }
    function clearToken() { localStorage.removeItem(SESSION_KEY); setToken(null); }
    function isLoggedIn() { return !!localStorage.getItem(SESSION_KEY); }
    async function login(email, password) {
      const url = `${window.__SUPABASE_URL__}/auth/v1/token?grant_type=password`;
      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: window.__SUPABASE_ANON__ }, body: JSON.stringify({ email, password }) });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error_description ?? body.msg ?? 'Login failed');
      saveToken(body.access_token);
      return body;
    }

    // --- THREE VIEWPORT ---
    class CADViewport {
      constructor(container) {
        this.container = container;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x14171c);
        this.camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10000);
        this.camera.position.set(200, 180, 200);
        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(this.renderer.domElement);
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dir = new THREE.DirectionalLight(0xffffff, 0.8); dir.position.set(1, 1, 1); this.scene.add(dir);
        this.scene.add(new THREE.GridHelper(400, 40, 0x444a55, 0x2a2f38));
        this.scene.add(new THREE.AxesHelper(50));
        this.modelGroup = new THREE.Group(); this.scene.add(this.modelGroup);
        this._resize = this._resize.bind(this);
        window.addEventListener('resize', this._resize);
        this._resize(); this._animate();
      }
      loadObject3D(obj) { this.modelGroup.clear(); this.modelGroup.add(obj); this.fitToObject(obj); }
      fitToObject(obj) {
        const box = new THREE.Box3().setFromObject(obj);
        if (box.isEmpty()) return;
        const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
        const d = Math.max(size.x, size.y, size.z) / (2 * Math.tan((this.camera.fov * Math.PI) / 360));
        this.camera.position.set(center.x + d, center.y + d, center.z + d);
        this.controls.target.copy(center); this.camera.near = d / 100; this.camera.far = d * 100;
        this.camera.updateProjectionMatrix(); this.controls.update();
      }
      setView(name) {
        const views = { iso: [1,1,1], front: [0,0,1], back: [0,0,-1], left: [-1,0,0], right: [1,0,0], top: [0,1,0], bottom: [0,-1,0] };
        const dir = views[name] ?? views.iso, box = new THREE.Box3().setFromObject(this.modelGroup);
        if (box.isEmpty()) return;
        const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3()), d = Math.max(size.x, size.y, size.z) * 2;
        this.camera.position.set(center.x + dir[0]*d, center.y + dir[1]*d, center.z + dir[2]*d);
        this.controls.target.copy(center); this.controls.update();
      }
      _resize() {
        const w = this.container.clientWidth, h = this.container.clientHeight;
        if (!w || !h) return;
        this.camera.aspect = w / h; this.camera.updateProjectionMatrix(); this.renderer.setSize(w, h);
      }
      _animate() { requestAnimationFrame(() => this._animate()); this.controls.update(); this.renderer.render(this.scene, this.camera); }
    }

    // --- VIEWS ---
    async function renderDashboard(root, { onProjectOpened }) {
      root.classList.add('split');
      root.innerHTML = `
        <section class="panel">
          <h2>New Project</h2>
          <form id="new-project"><label>Project name <input name="name" required /></label><label>Part number <input name="part_number" /></label><label>Revision <input name="revision" value="A" /></label><label>Description <textarea name="description" rows="3"></textarea></label><button type="submit">Create Project</button></form>
        </section>
        <section class="panel"><h2>Projects</h2><ul id="project-list" class="project-list"><li class="hint">Loading…</li></ul></section>`;
      root.querySelector('#new-project').addEventListener('submit', async (e) => {
        e.preventDefault();
        try { const p = await api.post('/projects', Object.fromEntries(new FormData(e.target))); onProjectOpened(p.id); } catch (err) { alert(err.message); }
      });
      try {
        const projects = await api.get('/projects'), ul = root.querySelector('#project-list');
        if (projects.length === 0) { ul.innerHTML = '<li class="hint">No projects yet.</li>'; return; }
        ul.innerHTML = '';
        for (const p of projects) {
          const li = document.createElement('li');
          li.innerHTML = `<span>${escapeHtml(p.name)} <small style="color:var(--muted)">${escapeHtml(p.part_number ?? '')}</small></span><span class="status">${p.status}</span>`;
          li.addEventListener('click', () => onProjectOpened(p.id));
          ul.appendChild(li);
        }
      } catch (err) { root.querySelector('#project-list').innerHTML = `<li class="warn">${err.message}</li>`; }
    }

    async function renderProject(root, projectId) {
      root.innerHTML = `<section class="panel"><h2>Project</h2><p class="hint">Loading…</p></section>`;
      try {
        const p = await api.get(`/projects/${projectId}`);
        root.innerHTML = `<section class="panel"><h2>${escapeHtml(p.name)}</h2><div class="info-grid"><dl><dt>Part number</dt><dd>${escapeHtml(p.part_number ?? '—')}</dd><dt>Revision</dt><dd>${escapeHtml(p.revision ?? '—')}</dd><dt>Status</dt><dd>${p.status}</dd><dt>Description</dt><dd>${escapeHtml(p.description ?? '—')}</dd><dt>Created</dt><dd>${new Date(p.created_at).toLocaleString()}</dd></dl></div></section>`;
      } catch (err) { root.innerHTML = `<section class="panel"><p class="warn">${err.message}</p></section>`; }
    }

    async function renderModelView(root, projectId) {
      root.classList.add('split');
      root.innerHTML = `
        <section class="panel">
          <h2>3D Model</h2>
          <form id="upload-form"><input type="file" id="cad-file" accept=".step,.stp,.iges,.igs,.stl,.obj" required /><button type="submit">Upload &amp; Load</button></form>
          <p class="hint">STEP/IGES are parsed by OCCT (Phase 2). STL/OBJ are mesh-only — analytic surfaces and tolerances are not preserved.</p>
          <div id="model-info" class="info-grid"></div>
        </section>
        <section class="viewport-panel"><div id="viewport" class="viewport"></div><div class="view-toolbar"><button data-view="iso">ISO</button><button data-view="front">Front</button><button data-view="top">Top</button><button data-view="right">Right</button></div></section>`;
      const viewport = new CADViewport(root.querySelector('#viewport'));
      root.querySelectorAll('.view-toolbar button').forEach(btn => btn.addEventListener('click', () => viewport.setView(btn.dataset.view)));
      root.querySelector('#upload-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const file = root.querySelector('#cad-file').files[0]; if (!file) return;
        const fd = new FormData(); fd.append('file', file); fd.append('projectId', projectId);
        try {
          const meta = await api.upload(`/models?projectId=${encodeURIComponent(projectId)}`, fd);
          renderModelInfo(root.querySelector('#model-info'), meta);
          if (meta.file_format === 'stl') {
            const geom = new STLLoader().parse(await file.arrayBuffer()); geom.computeVertexNormals();
            viewport.loadObject3D(new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ color: 0x8fa6b8, metalness: 0.3, roughness: 0.6 })));
          } else if (meta.file_format === 'obj') {
            viewport.loadObject3D(new OBJLoader().parse(await file.text()));
          } else {
            root.querySelector('#model-info').innerHTML += `<p class="warn">CAD parsing is Phase 2. File stored; analytic geometry extraction pending.</p>`;
          }
        } catch (err) { alert(`Upload failed: ${err.message}`); }
      });
    }

    async function renderSpecsView(root, projectId) {
      root.innerHTML = `
        <section class="panel"><h2>Engineering Specifications</h2>
          <form id="spec-form">
            <label>Material <input name="material" required /></label><label>Heat treatment <input name="heat_treatment" /></label>
            <label>Length (mm) <input name="length_mm" type="number" step="0.001" /></label><label>Width (mm) <input name="width_mm" type="number" step="0.001" /></label>
            <label>Height (mm) <input name="height_mm" type="number" step="0.001" /></label><label>Diameter (mm) <input name="diameter_mm" type="number" step="0.001" /></label>
            <label>Bore diameter (mm) <input name="bore_diameter_mm" type="number" step="0.001" /></label><label>Grinding allowance (mm) <input name="grinding_allowance_mm" type="number" step="0.001" /></label>
            <label>Surface roughness Ra <input name="surface_roughness_ra" type="number" step="0.001" /></label><label>Inspection requirements <textarea name="inspection_requirements" rows="3"></textarea></label>
            <button type="submit">Save Specifications</button>
          </form>
          <div id="spec-result"></div>
        </section>`;
      root.querySelector('#spec-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = { project_id: projectId };
        for (const [k, v] of new FormData(e.target).entries()) if (v !== '') payload[k] = v;
        try {
          const saved = await api.post('/specs', payload);
          root.querySelector('#spec-result').innerHTML = `<p class="ok">Specifications saved (id ${saved.id}).</p>`;
        } catch (err) { alert(err.message); }
      });
    }

    async function renderMachineView(root) {
      const DEFAULT_CHAIN = [
        { type: 'linear', axis: 'X', pivot: [0,0,0], direction: [1,0,0] }, { type: 'linear', axis: 'Y', pivot: [0,0,0], direction: [0,1,0] },
        { type: 'linear', axis: 'Z', pivot: [0,0,0], direction: [0,0,1] }, { type: 'rotary', axis: 'C', pivot: [0,0,0], direction: [0,0,1] },
        { type: 'rotary', axis: 'A', pivot: [0,0,0], direction: [1,0,0] }
      ];
      root.innerHTML = `
        <section class="panel"><h2>Machine Configuration</h2>
          <p class="hint">Axis arrangement is configurable. Default controller is FANUC Series 31i-B5 Plus, but installed options vary by machine builder.</p>
          <form id="machine-form">
            <label>Profile name <input name="name" required value="Default 5-Axis Grinder" /></label>
            <label>Controller <input name="controller" value="FANUC Series 31i-B5 Plus" /></label>
            <label>Builder <input name="builder" placeholder="e.g. Makino, Rollomatic" /></label>
            <label>Axis chain (JSON — order matters)<textarea name="chain" rows="14">${JSON.stringify(DEFAULT_CHAIN, null, 2)}</textarea></label>
            <button type="submit">Save Machine Profile</button>
          </form>
          <div id="machine-result"></div>
        </section>`;
      root.querySelector('#machine-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        let chain;
        try { chain = JSON.parse(new FormData(e.target).get('chain')); } catch { return alert('Axis chain is not valid JSON'); }
        try {
          const saved = await api.post('/machines', { name: new FormData(e.target).get('name'), controller: new FormData(e.target).get('controller'), builder: new FormData(e.target).get('builder'), kinematics_json: { chain } });
          root.querySelector('#machine-result').innerHTML = `<p class="ok">Saved profile <strong>${saved.name}</strong> (id ${saved.id}).</p><p class="hint">Kinematics validation is a Phase 3 deliverable.</p>`;
        } catch (err) { alert(err.message); }
      });
    }

    function renderModelInfo(el, meta) {
      const bb = meta.bounding_box, dims = bb ? bb.max.map((v, i) => (v - bb.min[i]).toFixed(2)).join(' × ') : '—';
      el.innerHTML = `<dl><dt>File</dt><dd>${escapeHtml(meta.file_name)}</dd><dt>Format</dt><dd>${meta.file_format.toUpperCase()}</dd><dt>Mesh only</dt><dd>${meta.is_mesh_only ? 'Yes' : 'No'}</dd><dt>Bounding dims</dt><dd>${dims} mm</dd></dl>`;
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

    // --- APP BOOTSTRAP ---
    const NAV = [
      { id: 'dashboard', label: 'Dashboard', render: renderDashboard }, { id: 'model', label: '3D Model', render: renderModelView, needsProject: true },
      { id: 'specs', label: 'Specifications', render: renderSpecsView, needsProject: true }, { id: 'machine', label: 'Machine Setup', render: renderMachineView }
    ];
    const root = document.getElementById('view-root'), nav = document.getElementById('main-nav'), userBadge = document.getElementById('user-badge');
    let currentProjectId = null;

    function updateNav(activeId) {
      nav.innerHTML = '';
      for (const item of NAV) {
        const b = document.createElement('button'); b.textContent = item.label;
        if (item.id === activeId) b.classList.add('active');
        b.addEventListener('click', () => { if (item.needsProject && !currentProjectId) return alert('Open a project first.'); navigate(item.id); });
        nav.appendChild(b);
      }
    }

    async function navigate(id) {
      updateNav(id); root.innerHTML = '';
      const item = NAV.find(n => n.id === id); if (!item) return;
      try {
        if (item.id === 'dashboard' || item.id === 'machine') await item.render(root, { onProjectOpened: (pid) => { currentProjectId = pid; navigate('model'); } });
        else await item.render(root, currentProjectId);
      } catch (e) { root.innerHTML = `<section class="panel"><h2>Error</h2><p class="warn">${e.message}</p></section>`; }
    }

    async function showLogin() {
      root.innerHTML = `<section class="panel" style="max-width:420px;margin:60px auto;"><h2>Sign in</h2><form id="login-form"><label>Email <input name="email" type="email" required /></label><label>Password <input name="password" type="password" required /></label><button type="submit">Sign in</button></form></section>`;
      root.querySelector('#login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try { await login(fd.get('email'), fd.get('password')); await boot(); } catch (err) { alert(`Login failed: ${err.message}`); }
      });
    }

    async function boot() {
      if (!isLoggedIn()) return showLogin();
      loadToken(); userBadge.innerHTML = '';
      const logout = document.createElement('button'); logout.textContent = 'Sign out';
      logout.style.cssText = 'background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:3px;cursor:pointer;';
      logout.addEventListener('click', () => { clearToken(); currentProjectId = null; boot(); });
      userBadge.appendChild(logout);
      await navigate('dashboard');
    }

    window.__SUPABASE_URL__ = window.__SUPABASE_URL__ ?? 'http://localhost:54321';
    window.__SUPABASE_ANON__ = window.__SUPABASE_ANON__ ?? '';
    boot();
  </script>
</body>
</html>
