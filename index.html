<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Q5 Syntec Tool Grinder CAM</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    /* CSS stays the same */
    :root { --bg: #14171c; --panel: #1c2128; --border: #2a3038; --text: #d5dbe3; --muted: #8a93a0; --accent: #3d8bfd; --ok: #4caf50; --warn: #ff9800; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    .topbar { display: flex; align-items: center; gap: 24px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
    .brand { font-weight: 600; color: var(--accent); }
    #main-nav { display: flex; gap: 8px; flex: 1; }
    #main-nav button { background: transparent; color: var(--muted); border: 1px solid transparent; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    #main-nav button:hover, #main-nav button.active { color: var(--accent); border-color: var(--accent); }
    main { display: grid; gap: 16px; padding: 16px; grid-template-columns: 1fr; flex: 1; overflow: auto; }
    main.split { grid-template-columns: 380px 1fr; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 16px; overflow: auto; }
    .panel h2 { margin: 0 0 12px; font-size: 16px; color: var(--accent); }
    .panel label { display: block; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
    .panel input, .panel textarea, .panel select { width: 100%; padding: 7px 9px; margin-top: 4px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 3px; font-family: inherit; font-size: 13px; }
    .panel button { padding: 8px 14px; background: var(--accent); color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 13px; }
    .panel button:hover { filter: brightness(1.1); }
    .viewport { min-height: 400px; background: #14171c; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .hint { color: var(--muted); font-size: 12px; margin: 8px 0; }
    .warn { color: var(--warn); font-size: 12px; }
    .ok { color: var(--ok); }
    .project-list { list-style: none; padding: 0; margin: 0; }
    .project-list li { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; display: flex; justify-content: space-between; }
    .project-list li:hover { background: #232a33; }
    .project-list .status { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #232a33; color: var(--muted); }
    pre.code-block { background: #0d1117; color: #c9d1d9; padding: 16px; border-radius: 6px; font-family: 'Consolas', monospace; font-size: 13px; overflow: auto; height: 100%; max-height: 500px; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">Q5 Syntec · Tool Grinding CAM</div>
      <nav id="main-nav"></nav>
      <div id="user-badge"></div>
    </header>
    <main id="view-root" aria-live="polite"></main>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- CLIENT API & AUTH ---
    let accessToken = null;
    function setToken(t) { accessToken = t; }
    async function request(path, options = {}) {
      const headers = {
        ...(options.body instanceof FormData ? {} : { 'Content-Type': 'application/json' }),
        ...(accessToken ? { Authorization: `Bearer ${accessToken}` } : {}),
        ...options.headers,
      };
      const res = await fetch(`/api${path}`, { ...options, headers });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error ?? `HTTP ${res.status}`);
      return body;
    }
    const api = {
      get: (p) => request(p),
      post: (p, data) => request(p, { method: 'POST', body: JSON.stringify(data) })
    };

    const SESSION_KEY = 'q5-cam-token';
    function loadToken() { const t = localStorage.getItem(SESSION_KEY); if (t) setToken(t); return t; }
    function saveToken(t) { localStorage.setItem(SESSION_KEY, t); setToken(t); }
    function clearToken() { localStorage.removeItem(SESSION_KEY); setToken(null); }
    function isLoggedIn() { return !!localStorage.getItem(SESSION_KEY); }
    
    async function login(email, password) {
      const url = `${window.__SUPABASE_URL__}/auth/v1/token?grant_type=password`;
      const res = await fetch(url, { 
        method: 'POST', 
        headers: { 'Content-Type': 'application/json', apikey: window.__SUPABASE_ANON__ }, 
        body: JSON.stringify({ email, password }) 
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error_description ?? body.msg ?? 'Login failed');
      saveToken(body.access_token);
      return body;
    }

    // --- THREE VIEWPORT ---
    class CADViewport {
      constructor(container) {
        this.container = container;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0x14171c);
        this.camera = new THREE.PerspectiveCamera(45, 1, 0.1, 10000);
        this.camera.position.set(200, 180, 200);
        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(this.renderer.domElement);
        this.controls = new OrbitControls(this.camera, this.renderer.domElement);
        this.controls.enableDamping = true;
        this.scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dir = new THREE.DirectionalLight(0xffffff, 0.8); dir.position.set(1, 1, 1); this.scene.add(dir);
        this.scene.add(new THREE.GridHelper(400, 40, 0x444a55, 0x2a2f38));
        this.scene.add(new THREE.AxesHelper(50));
        this.modelGroup = new THREE.Group(); this.scene.add(this.modelGroup);
        this._resize = this._resize.bind(this);
        window.addEventListener('resize', this._resize);
        this._resize(); this._animate();
      }
      loadObject3D(obj) { this.modelGroup.clear(); this.modelGroup.add(obj); this.fitToObject(obj); }
      drawToolpath(points) {
        const geom = new THREE.BufferGeometry().setFromPoints(
          points.map(p => new THREE.Vector3(p.position[0], p.position[1], p.position[2]))
        );
        const line = new THREE.Line(geom, new THREE.LineBasicMaterial({ color: 0x4caf50, linewidth: 2 }));
        this.modelGroup.add(line);
      }
      fitToObject(obj) {
        const box = new THREE.Box3().setFromObject(obj);
        if (box.isEmpty()) return;
        const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
        const d = Math.max(size.x, size.y, size.z) / (2 * Math.tan((this.camera.fov * Math.PI) / 360));
        this.camera.position.set(center.x + d, center.y + d, center.z + d);
        this.controls.target.copy(center); this.camera.near = d / 100; this.camera.far = d * 100;
        this.camera.updateProjectionMatrix(); this.controls.update();
      }
      _resize() {
        const w = this.container.clientWidth, h = this.container.clientHeight;
        if (!w || !h) return;
        this.camera.aspect = w / h; this.camera.updateProjectionMatrix(); this.renderer.setSize(w, h);
      }
      _animate() { requestAnimationFrame(() => this._animate()); this.controls.update(); this.renderer.render(this.scene, this.camera); }
    }

    // --- VIEWS ---
    async function renderDashboard(root, { onProjectOpened }) {
      root.classList.add('split');
      root.innerHTML = `
        <section class="panel">
          <h2>New Project</h2>
          <form id="new-project"><label>Project name <input name="name" required /></label><label>Part number <input name="part_number" /></label><button type="submit">Create Project</button></form>
        </section>
        <section class="panel"><h2>Projects</h2><ul id="project-list" class="project-list"><li class="hint">Loading…</li></ul></section>`;
      root.querySelector('#new-project').addEventListener('submit', async (e) => {
        e.preventDefault();
        try { const p = await api.post('/projects', Object.fromEntries(new FormData(e.target))); onProjectOpened(p.id); } catch (err) { alert(err.message); }
      });
      try {
        const projects = await api.get('/projects'), ul = root.querySelector('#project-list');
        if (projects.length === 0) { ul.innerHTML = '<li class="hint">No projects yet.</li>'; return; }
        ul.innerHTML = '';
        for (const p of projects) {
          const li = document.createElement('li');
          li.innerHTML = `<span>${escapeHtml(p.name)}</span><span class="status">${p.status}</span>`;
          li.addEventListener('click', () => onProjectOpened(p.id));
          ul.appendChild(li);
        }
      } catch (err) { root.querySelector('#project-list').innerHTML = `<li class="warn">${err.message}</li>`; }
    }

    async function renderMachineView(root) {
      const DEFAULT_CHAIN = [
        { type: 'linear', axis: 'X', pivot: [0,0,0], direction: [1,0,0], travel_min: -200, travel_max: 200 },
        { type: 'linear', axis: 'Y', pivot: [0,0,0], direction: [0,1,0], travel_min: -200, travel_max: 200 },
        { type: 'linear', axis: 'Z', pivot: [0,0,0], direction: [0,0,1], travel_min: -100, travel_max: 100 },
        { type: 'rotary', axis: 'C', pivot: [0,0,0], direction: [0,0,1] },
        { type: 'rotary', axis: 'A', pivot: [0,0,0], direction: [1,0,0] }
      ];
      root.innerHTML = `
        <section class="panel"><h2>Q5 Machine Configuration</h2>
          <form id="machine-form">
            <label>Profile name <input name="name" required value="Q5 Syntec Default" /></label>
            <label>Controller <input name="controller" value="Syntec" /></label>
            <label>Axis chain (JSON)<textarea name="chain" rows="10">${JSON.stringify(DEFAULT_CHAIN, null, 2)}</textarea></label>
            <button type="submit">Save Machine Profile</button>
          </form>
          <div id="machine-result"></div>
        </section>`;
      root.querySelector('#machine-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        let chain;
        try { chain = JSON.parse(new FormData(e.target).get('chain')); } catch { return alert('Invalid JSON'); }
        try {
          const saved = await api.post('/machines', { name: new FormData(e.target).get('name'), controller: new FormData(e.target).get('controller'), kinematics_json: { chain } });
          root.querySelector('#machine-result').innerHTML = `<p class="ok">Saved profile: ${saved.id}</p>`;
        } catch (err) { alert(err.message); }
      });
    }

    async function renderGcodeView(root, projectId) {
      root.classList.add('split');
      root.innerHTML = `
        <section class="panel">
          <h2>Generate G-Code</h2>
          <form id="gcode-form">
            <label>Machine Profile ID <input name="machine_id" required placeholder="Paste ID from Machine tab" /></label>
            <label>Program Number <input name="programNumber" type="number" value="1001" /></label>
            <label>Part Name <input name="partName" value="Q5-TOOL" /></label>
            <hr style="border-color:var(--border); margin: 16px 0;"/>
            <label>Start X <input name="startX" type="number" value="-50" /></label>
            <label>End X <input name="endX" type="number" value="50" /></label>
            <label>Start Y <input name="startY" type="number" value="-20" /></label>
            <label>End Y <input name="endY" type="number" value="20" /></label>
            <label>Step Over (mm) <input name="stepOver" type="number" value="5" step="0.1" /></label>
            <label>Z Depth (mm) <input name="zDepth" type="number" value="-2" /></label>
            <label>Feed Rate <input name="feedRate" type="number" value="500" /></label>
            <button type="submit">Generate G-Code</button>
          </form>
          <div id="gcode-result" style="margin-top:16px;"></div>
        </section>
        <section class="panel" style="display:flex; flex-direction:column; gap:8px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0;">G-Code Output</h2>
            <button id="download-btn" style="display:none; background:var(--ok);">Download .nc</button>
          </div>
          <pre id="gcode-output" class="code-block">Waiting for generation...</pre>
          <div class="viewport" id="viewport"></div>
        </section>`;

      const viewport = new CADViewport(root.querySelector('#viewport'));
      let currentGcode = '';

      root.querySelector('#gcode-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = { project_id: projectId };
        for (const [k, v] of fd.entries()) payload[k] = v;

        try {
          root.querySelector('#gcode-output').textContent = "Generating toolpath and calculating kinematics...";
          const res = await api.post('/gcode/generate', payload);
          
          currentGcode = res.gcode;
          root.querySelector('#gcode-output').textContent = res.gcode;
          root.querySelector('#gcode-result').innerHTML = `<p class="ok">Successfully generated ${res.gcode.split('\n').length} blocks.</p>`;
          
          const dlBtn = root.querySelector('#download-btn');
          dlBtn.style.display = 'block';
          dlBtn.onclick = () => {
            const blob = new Blob([currentGcode], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `O${payload.programNumber}.nc`;
            a.click();
            URL.revokeObjectURL(url);
          };

          // Draw toolpath in 3D
          viewport.modelGroup.clear();
          viewport.drawToolpath(res.toolpath);
          
        } catch (err) {
          root.querySelector('#gcode-output').textContent = `Error: ${err.message}`;
          root.querySelector('#gcode-result').innerHTML = `<p class="warn">Validation Failed.</p>`;
        }
      });
    }

    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

    // --- APP BOOTSTRAP ---
    const NAV = [
      { id: 'dashboard', label: 'Dashboard', render: renderDashboard }, 
      { id: 'machine', label: 'Machine Setup', render: renderMachineView },
      { id: 'gcode', label: 'G-Code Generator', render: renderGcodeView, needsProject: true }
    ];
    const root = document.getElementById('view-root'), nav = document.getElementById('main-nav'), userBadge = document.getElementById('user-badge');
    let currentProjectId = null;

    function updateNav(activeId) {
      nav.innerHTML = '';
      for (const item of NAV) {
        const b = document.createElement('button'); b.textContent = item.label;
        if (item.id === activeId) b.classList.add('active');
        b.addEventListener('click', () => { if (item.needsProject && !currentProjectId) return alert('Open a project first.'); navigate(item.id); });
        nav.appendChild(b);
      }
    }

    async function navigate(id) {
      updateNav(id); root.innerHTML = ''; root.className = '';
      const item = NAV.find(n => n.id === id); if (!item) return;
      try {
        if (item.id === 'dashboard' || item.id === 'machine') await item.render(root, { onProjectOpened: (pid) => { currentProjectId = pid; navigate('gcode'); } });
        else await item.render(root, currentProjectId);
      } catch (e) { root.innerHTML = `<section class="panel"><h2>Error</h2><p class="warn">${e.message}</p></section>`; }
    }

    async function showLogin() {
      root.innerHTML = `
        <section class="panel" style="max-width:420px;margin:60px auto;">
          <h2 id="auth-title">Sign in</h2>
          <form id="auth-form">
            <label>Email <input name="email" type="email" required /></label>
            <label>Password <input name="password" type="password" required minlength="6" /></label>
            <button type="submit" id="auth-btn" style="width:100%;">Sign in</button>
          </form>
          <p style="text-align:center; margin-top:16px; font-size:13px;">
            <a href="#" id="toggle-auth" style="color:var(--accent); text-decoration:none;">Create an account</a>
          </p>
        </section>`;

      let isSignUp = false;
      const title = root.querySelector('#auth-title'), btn = root.querySelector('#auth-btn'), toggle = root.querySelector('#toggle-auth'), form = root.querySelector('#auth-form');

      toggle.addEventListener('click', (e) => {
        e.preventDefault(); isSignUp = !isSignUp;
        title.textContent = isSignUp ? 'Create Account' : 'Sign in';
        btn.textContent = isSignUp ? 'Sign Up' : 'Sign in';
        toggle.textContent = isSignUp ? 'Already have an account? Sign in' : 'Create an account';
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        try {
          if (isSignUp) {
            await api.post('/auth/signup', { email: fd.get('email'), password: fd.get('password') });
            alert('Account created! You can now sign in.');
            isSignUp = false; title.textContent = 'Sign in'; btn.textContent = 'Sign in'; toggle.textContent = 'Create an account'; form.reset();
          } else {
            await login(fd.get('email'), fd.get('password'));
            await boot();
          }
        } catch (err) { alert(`${isSignUp ? 'Signup' : 'Login'} failed: ${err.message}`); }
      });
    }

    async function boot() {
      if (!isLoggedIn()) return showLogin();
      loadToken(); userBadge.innerHTML = '';
      const logout = document.createElement('button'); logout.textContent = 'Sign out';
      logout.style.cssText = 'background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:3px;cursor:pointer;';
      logout.addEventListener('click', () => { clearToken(); currentProjectId = null; boot(); });
      userBadge.appendChild(logout);
      await navigate('dashboard');
    }
    boot();
  </script>
</body>
</html>
